<svg width="1414" height="1000" viewBox="0 0 1414 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="botBase" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FBF9FF"/>
    <stop offset="100%" stop-color="#F4EFFC"/>
  </linearGradient>
</defs>

<rect width="1414" height="1000" fill="url(#botBase)"/>

<!-- a single leafy branch motif, mirrored into all four corners, line-art style -->
<g id="branch" fill="none" stroke="#6846C6" stroke-width="2.4" stroke-linecap="round" opacity="0.65">
  <path d="M 0 0 C 60 20, 110 60, 150 120 S 210 240, 220 320"/>
  <path d="M 20 30 C 50 24, 78 30, 96 54" />
  <path d="M 48 66 C 80 56, 112 62, 132 88"/>
  <path d="M 78 108 C 112 96, 146 104, 168 132"/>
  <path d="M 112 156 C 148 146, 182 154, 204 182"/>
  <path d="M 146 210 C 178 202, 208 210, 228 234"/>
  <path d="M 176 266 C 200 260, 222 266, 236 286"/>
</g>
<g id="leaf" fill="#8B6EE0" opacity="0.35">
  <ellipse cx="96" cy="54" rx="16" ry="8" transform="rotate(35 96 54)"/>
  <ellipse cx="132" cy="88" rx="18" ry="9" transform="rotate(30 132 88)"/>
  <ellipse cx="168" cy="132" rx="19" ry="9.5" transform="rotate(25 168 132)"/>
  <ellipse cx="204" cy="182" rx="18" ry="9" transform="rotate(20 204 182)"/>
  <ellipse cx="228" cy="234" rx="15" ry="7.5" transform="rotate(15 228 234)"/>
</g>

<use href="#leaf" transform="translate(0,0)"/>
<use href="#branch" transform="translate(0,0)"/>

<use href="#branch" transform="translate(1414,0) scale(-1,1)"/>
<use href="#leaf" transform="translate(1414,0) scale(-1,1)"/>

<use href="#branch" transform="translate(0,1000) scale(1,-1)"/>
<use href="#leaf" transform="translate(0,1000) scale(1,-1)"/>

<use href="#branch" transform="translate(1414,1000) scale(-1,-1)"/>
<use href="#leaf" transform="translate(1414,1000) scale(-1,-1)"/>

<!-- a few loose scattered leaves and blossom dots drifting toward the centre for warmth -->
<g fill="#3860BE" opacity="0.3">
  <ellipse cx="420" cy="90" rx="14" ry="7" transform="rotate(-20 420 90)"/>
  <ellipse cx="980" cy="130" rx="15" ry="7.5" transform="rotate(15 980 130)"/>
  <ellipse cx="360" cy="900" rx="14" ry="7" transform="rotate(10 360 900)"/>
  <ellipse cx="1040" cy="860" rx="16" ry="8" transform="rotate(-15 1040 860)"/>
</g>
<g fill="#F5B841" opacity="0.55">
  <circle cx="470" cy="150" r="4"/>
  <circle cx="940" cy="80" r="3.5"/>
  <circle cx="300" cy="850" r="4"/>
  <circle cx="1100" cy="910" r="3.5"/>
</g>

<!-- a fine hairline frame, echoing an invitation card -->
<rect x="36" y="36" width="1342" height="928" fill="none" stroke="#6846C6" stroke-width="1.2" opacity="0.35"/>
</svg>
