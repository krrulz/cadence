<svg width="1414" height="1000" viewBox="0 0 1414 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="constBase" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0C0814"/>
    <stop offset="100%" stop-color="#141026"/>
  </linearGradient>
  <radialGradient id="constGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3860BE" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#3860BE" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1414" height="1000" fill="url(#constBase)"/>
<circle cx="1150" cy="220" r="340" fill="url(#constGlow)"/>
<circle cx="220" cy="820" r="300" fill="url(#constGlow)" opacity="0.7"/>

<!-- faint scattered background stars -->
<g fill="#FFFFFF" opacity="0.5">
  <circle cx="60" cy="60" r="1.4"/><circle cx="150" cy="120" r="1.1"/><circle cx="260" cy="50" r="1.6"/>
  <circle cx="400" cy="160" r="1.2"/><circle cx="520" cy="70" r="1.5"/><circle cx="660" cy="130" r="1.1"/>
  <circle cx="80" cy="700" r="1.3"/><circle cx="200" cy="600" r="1.5"/><circle cx="340" cy="750" r="1.1"/>
  <circle cx="1000" cy="600" r="1.4"/><circle cx="1150" cy="700" r="1.2"/><circle cx="1300" cy="620" r="1.5"/>
  <circle cx="900" cy="900" r="1.3"/><circle cx="1050" cy="950" r="1.1"/><circle cx="1250" cy="900" r="1.4"/>
  <circle cx="500" cy="880" r="1.2"/><circle cx="650" cy="940" r="1.5"/><circle cx="780" cy="870" r="1.1"/>
</g>

<!-- a journey constellation: a dotted flight path from lower-left to a bright star upper-right,
     evoking "new horizons ahead" -->
<g>
  <path d="M 120 850 C 300 800, 420 700, 560 640 S 820 480, 980 380 S 1180 260, 1290 210"
        fill="none" stroke="#8B6EE0" stroke-width="1.5" stroke-dasharray="2 14" stroke-linecap="round" opacity="0.7"/>

  <g fill="#F5B841">
    <circle cx="120" cy="850" r="4"/>
    <circle cx="330" cy="760" r="3"/>
    <circle cx="560" cy="640" r="3.5"/>
    <circle cx="760" cy="540" r="3"/>
    <circle cx="980" cy="380" r="3.5"/>
    <circle cx="1150" cy="270" r="3"/>
  </g>

  <!-- destination star, bright with cross-flare -->
  <g transform="translate(1290 210)">
    <circle r="7" fill="#FFFFFF"/>
    <path d="M -26 0 H 26 M 0 -26 V 26" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85"/>
    <path d="M -16 -16 L 16 16 M -16 16 L 16 -16" stroke="#FFFFFF" stroke-width="1" opacity="0.55"/>
    <circle r="16" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  </g>
</g>

<!-- two small constellations for texture, connected-dot style -->
<g stroke="#6846C6" stroke-width="1" opacity="0.55" fill="#6846C6">
  <path d="M 180 200 L 240 160 L 300 210 L 360 150" fill="none"/>
  <circle cx="180" cy="200" r="2.5"/><circle cx="240" cy="160" r="2.5"/>
  <circle cx="300" cy="210" r="2.5"/><circle cx="360" cy="150" r="2.5"/>
</g>
<g stroke="#3860BE" stroke-width="1" opacity="0.55" fill="#3860BE">
  <path d="M 1000 820 L 1070 790 L 1110 840 L 1180 800" fill="none"/>
  <circle cx="1000" cy="820" r="2.5"/><circle cx="1070" cy="790" r="2.5"/>
  <circle cx="1110" cy="840" r="2.5"/><circle cx="1180" cy="800" r="2.5"/>
</g>
</svg>
