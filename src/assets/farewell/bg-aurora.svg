<svg width="1414" height="1000" viewBox="0 0 1414 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="auroraBase" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0C0814"/>
    <stop offset="55%" stop-color="#160F2B"/>
    <stop offset="100%" stop-color="#0C0814"/>
  </linearGradient>
  <radialGradient id="auroraGlowA" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#6846C6" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#6846C6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="auroraGlowB" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3860BE" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#3860BE" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#3860BE" stop-opacity="0"/>
    <stop offset="50%" stop-color="#8B6EE0" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#3860BE" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ribbon2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#6846C6" stop-opacity="0"/>
    <stop offset="50%" stop-color="#3860BE" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#6846C6" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="1414" height="1000" fill="url(#auroraBase)"/>

<circle cx="220" cy="150" r="340" fill="url(#auroraGlowA)"/>
<circle cx="1220" cy="850" r="380" fill="url(#auroraGlowB)"/>
<circle cx="1300" cy="140" r="220" fill="url(#auroraGlowA)" opacity="0.6"/>
<circle cx="140" cy="880" r="220" fill="url(#auroraGlowB)" opacity="0.55"/>

<!-- sweeping aurora ribbons across the middle band -->
<path d="M -80 420 C 220 340, 420 500, 707 400 S 1200 300, 1494 420" fill="none" stroke="url(#ribbon1)" stroke-width="90" stroke-linecap="round" opacity="0.8"/>
<path d="M -80 540 C 240 620, 460 460, 707 560 S 1180 660, 1494 540" fill="none" stroke="url(#ribbon2)" stroke-width="70" stroke-linecap="round" opacity="0.7"/>
<path d="M -80 300 C 260 220, 480 360, 707 260 S 1160 180, 1494 280" fill="none" stroke="url(#ribbon1)" stroke-width="50" stroke-linecap="round" opacity="0.5"/>

<!-- scattered starfield -->
<g fill="#FFFFFF">
  <circle cx="90" cy="90" r="2.2" opacity="0.8"/>
  <circle cx="180" cy="60" r="1.4" opacity="0.6"/>
  <circle cx="340" cy="130" r="1.8" opacity="0.7"/>
  <circle cx="520" cy="70" r="1.3" opacity="0.5"/>
  <circle cx="640" cy="150" r="2" opacity="0.75"/>
  <circle cx="800" cy="80" r="1.5" opacity="0.6"/>
  <circle cx="960" cy="130" r="1.9" opacity="0.7"/>
  <circle cx="1100" cy="70" r="1.4" opacity="0.55"/>
  <circle cx="1260" cy="110" r="2.1" opacity="0.8"/>
  <circle cx="1360" cy="60" r="1.5" opacity="0.6"/>
  <circle cx="70" cy="900" r="1.8" opacity="0.65"/>
  <circle cx="260" cy="950" r="1.4" opacity="0.5"/>
  <circle cx="500" cy="910" r="2" opacity="0.7"/>
  <circle cx="720" cy="960" r="1.5" opacity="0.55"/>
  <circle cx="980" cy="900" r="1.9" opacity="0.7"/>
  <circle cx="1180" cy="950" r="1.4" opacity="0.5"/>
  <circle cx="1340" cy="900" r="2.2" opacity="0.8"/>
</g>

<!-- a soft, even dimming toward the edges so scattered notes stay legible everywhere -->
<rect width="1414" height="1000" fill="#0C0814" opacity="0.18"/>
</svg>
