<svg width="1414" height="1000" viewBox="0 0 1414 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="journeySky" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#EAE3FB"/>
    <stop offset="55%" stop-color="#F3EEFD"/>
    <stop offset="100%" stop-color="#FCFBFF"/>
  </linearGradient>
  <radialGradient id="journeySun" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F5B841" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#F5B841" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1414" height="1000" fill="url(#journeySky)"/>
<circle cx="1220" cy="180" r="220" fill="url(#journeySun)"/>
<circle cx="1220" cy="180" r="42" fill="#FCEFD2"/>

<!-- soft cloud puffs, top and bottom corners so the middle stays clear for wishes -->
<g fill="#FFFFFF" opacity="0.85">
  <g transform="translate(140,110)">
    <circle cx="0" cy="20" r="26"/><circle cx="34" cy="8" r="34"/><circle cx="72" cy="20" r="24"/>
    <rect x="-10" y="18" width="104" height="24" rx="12"/>
  </g>
  <g transform="translate(1000,80) scale(0.8)">
    <circle cx="0" cy="20" r="26"/><circle cx="34" cy="8" r="34"/><circle cx="72" cy="20" r="24"/>
    <rect x="-10" y="18" width="104" height="24" rx="12"/>
  </g>
  <g transform="translate(80,860) scale(0.7)">
    <circle cx="0" cy="20" r="26"/><circle cx="34" cy="8" r="34"/><circle cx="72" cy="20" r="24"/>
    <rect x="-10" y="18" width="104" height="24" rx="12"/>
  </g>
  <g transform="translate(1180,900) scale(0.9)">
    <circle cx="0" cy="20" r="26"/><circle cx="34" cy="8" r="34"/><circle cx="72" cy="20" r="24"/>
    <rect x="-10" y="18" width="104" height="24" rx="12"/>
  </g>
</g>

<!-- dotted flight path arcing across the whole card, a quiet "new journey ahead" motif -->
<path d="M 60 780 C 260 700, 420 560, 560 460 S 820 260, 1000 190 S 1240 130, 1340 110"
      fill="none" stroke="#6846C6" stroke-width="2.5" stroke-dasharray="1 16" stroke-linecap="round" opacity="0.55"/>

<!-- simple folded paper-plane riding the path, banking gently -->
<g transform="translate(720,330) rotate(-18)">
  <path d="M -60 10 L 60 -18 L 6 6 L 14 34 L -4 10 Z" fill="#3860BE"/>
  <path d="M -60 10 L 6 6 L 14 34 Z" fill="#6846C6"/>
  <path d="M -60 10 L 60 -18 L 6 6 Z" fill="none" stroke="#241857" stroke-width="1.2" stroke-linejoin="round" opacity="0.4"/>
</g>

<!-- two small birds for whimsy -->
<g stroke="#3860BE" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55">
  <path d="M 260 220 q 14 -14 28 0 q 14 -14 28 0"/>
  <path d="M 330 260 q 10 -10 20 0 q 10 -10 20 0"/>
</g>

<!-- fine hairline frame, echoing an invitation / postcard -->
<rect x="36" y="36" width="1342" height="928" fill="none" stroke="#6846C6" stroke-width="1.2" opacity="0.3"/>
</svg>
